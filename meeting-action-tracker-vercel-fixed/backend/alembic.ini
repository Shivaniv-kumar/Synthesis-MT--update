# Alembic configuration file
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to the Alembic scripts directory
script_location = alembic

# Template for migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Maximum length of the slug portion of generated filenames
truncate_slug_length = 40

# Set to 'true' to run the environment during 'revision' as well
revision_environment = false

# Set to 'true' to allow .pyc files without source .py files
sourceless = false

# Version path separator (os, : or ;)
version_path_separator = os

# The output encoding for migration scripts
output_encoding = utf-8

# NOTE: sqlalchemy.url is intentionally left blank here.
# It is read from the DATABASE_URL environment variable inside alembic/env.py.
# Do NOT hard-code credentials in this file.
sqlalchemy.url =

[post_write_hooks]
# Automatically format generated migration files
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
